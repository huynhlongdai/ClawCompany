[pytest]
# WP-1.2 dựng file này vì 22 test async vừa bị **skip im lặng**: không có
# pytest-asyncio thì pytest chỉ cảnh báo rồi bỏ qua coroutine, và suite vẫn báo
# xanh. Đúng dạng "xanh không đồng nghĩa với đã kiểm chứng" mà HANDOFF mục P1
# đã ghi — nên chỗ này phải là lỗi, không phải cảnh báo.
testpaths = tests
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# Một coroutine test không được thu gom sẽ làm suite đỏ thay vì bị bỏ qua.
filterwarnings =
    error::pytest.PytestUnhandledCoroutineWarning

# D0.1/D1.4: test chỉ có nghĩa trên Postgres thật (khoá hàng, UPDATE song song).
# Chạy khi có TEST_POSTGRES_URL; job `postgres` của CI chọn riêng bằng `-m postgres`.
markers =
    postgres: cần TEST_POSTGRES_URL trỏ tới Postgres thật
