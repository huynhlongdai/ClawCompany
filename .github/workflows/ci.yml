# D0.1 — CI tối thiểu. Bốn job; branch protection trên `main` đòi cả bốn xanh.
name: ci
on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend · pytest
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r requirements.txt
      - name: một đường ghi task.status (D1.4)
        run: python ../tools/lint_task_status.py
      - run: python -m pytest -q -p no:cacheprovider

  postgres:
    name: postgres · alembic + concurrency
    runs-on: ubuntu-latest
    services:
      pg:
        image: pgvector/pgvector:pg16  # migration cần extension vector
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: cc}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cc
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cc_concurrency
      JWT_SECRET: ci
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r requirements.txt
      - name: alembic upgrade head trên Postgres 16 thật
        run: python -m alembic upgrade head
      - name: downgrade một bước rồi lên lại
        run: python -m alembic downgrade -1 && python -m alembic upgrade head
      - name: test chỉ có ý nghĩa trên Postgres (checkout song song)
        run: |
          python - <<'PY'
          import psycopg
          c = psycopg.connect("postgresql://postgres:postgres@localhost:5432/cc", autocommit=True)
          c.execute("CREATE DATABASE cc_concurrency")
          PY
          python -m pytest -q -p no:cacheprovider -m postgres

  frontend:
    name: frontend · tsc + next build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm}
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next build
        env: {NEXT_PUBLIC_API_BASE: "http://localhost:8000/api"}
