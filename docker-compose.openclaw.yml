# Gateway OpenClaw thật cho ClawCompany (thay OPENCLAW_MODE=mock).
#   VM: tools/openclaw_setup.sh (1 lần: .env.openclaw, secrets/provider_key, openclaw.json, CLI /usr/local/bin/openclaw)
#   rồi mọi lệnh compose qua tools/oc_compose.sh (nạp .env + .env.openclaw). Key model: tools/set_provider.sh.
# Gateway chỉ nằm trong mạng docker (không publish cổng); api/worker/beat gọi ws://openclaw:18789.
x-openclaw-env: &oc-env
  OPENCLAW_MODE: native
  OPENCLAW_GATEWAY_WS: ws://openclaw:18789
  OPENCLAW_API_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?thiếu OPENCLAW_GATEWAY_TOKEN}
  # M1.1: api/worker/beat dùng chung 1 khoá thiết bị → chỉ phải duyệt ghép đôi 1 lần
  OPENCLAW_DEVICE_IDENTITY_PATH: /var/lib/clawcompany/openclaw-device.json
  # M3: agents.create/config.* cần operator.admin; duyệt lệnh exec cần operator.approvals + cap exec-approvals
  OPENCLAW_REQUEST_ADMIN_SCOPE: "true"
  OPENCLAW_REQUEST_APPROVALS_SCOPE: "true"
  # M1.3: api khởi động lại thì gắn lại follower cho việc đang chạy; mỗi 60s
  # quét phiên không ai theo dõi (lease quyết định tiến trình nào nhận).
  OPENCLAW_RESUME_ON_BOOT: "true"
  OPENCLAW_CLAIM_SWEEP_SECONDS: "60"
services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:2026.9.8
    restart: unless-stopped
    command: ["node", "openclaw.mjs", "gateway", "--bind", "lan", "--port", "18789"]
    env_file: [.env.openclaw]
    volumes:
      - openclaw_home:/home/node/.openclaw
      # Key provider (SecretRef file, singleValue) — file thuộc uid 1000, quyền 600; tools/set_provider.sh ghi.
      - ./secrets:/home/node/.openclaw-secrets:ro
  api:
    environment: *oc-env
    volumes: [clawcompany_device:/var/lib/clawcompany]
    depends_on: [openclaw]
  worker:
    environment: *oc-env
    volumes: [clawcompany_device:/var/lib/clawcompany]
  beat:
    environment: *oc-env
    volumes: [clawcompany_device:/var/lib/clawcompany]
volumes:
  openclaw_home:
  clawcompany_device:
